name: Check links

on:
  push:
    paths:
      - .github/workflows/check_links.yaml
      - mlc_config.json
      - '**.md'
  pull_request:
    paths:
      - .github/workflows/check_links.yaml
      - mlc_config.json
      - '**.md'

jobs:
  check_links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: tcort/github-action-markdown-link-check@v1
        with:
          config-file: mlc_config.json
          use-verbose-mode: yes
